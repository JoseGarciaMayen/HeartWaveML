name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Configure DVC
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ID }}

      - name: DVC Pull models for integration tests
        run: dvc pull -f -r origin src/saved_models/modelTransformer.keras src/saved_models/scaler_seq.joblib

      - name: Install test dependencies
        run: pip install -r requirements_api.txt pytest httpx ruff pyyaml

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Configure DVC
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ID }}

      - name: DVC Pull specific model
        run: dvc pull -f -r origin src/saved_models/modelTransformer.keras src/saved_models/scaler_seq.joblib

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Docker build
        run: |
          docker build -t josegm61/heartwaveml:latest -t josegm61/heartwaveml:${{ github.sha }} .

      - name: Docker push
        run: |
          docker push josegm61/heartwaveml:latest
          docker push josegm61/heartwaveml:${{ github.sha }}
