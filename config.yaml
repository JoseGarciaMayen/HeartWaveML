data:
  feat_train: "data/processed/feat/mitbih_train_features.csv"
  feat_cv:    "data/processed/feat/mitbih_cv_features.csv"
  feat_test:  "data/processed/feat/mitbih_test_features.csv"
  base_train: "data/processed/base/mitbih_train.csv"
  base_cv:    "data/processed/base/mitbih_cv.csv"
  base_test:  "data/processed/base/mitbih_test.csv"

sequences:
  window: 45  # context window for the sequence models: K beats before + current + K beats after (K = window//2)

hardware:
  intra_op_threads: null  # null = auto (os.cpu_count()). TF CPU compute thread pool.
  inter_op_threads: 1     # parallel independent ops; keep low, intra_op already saturates cores.

# Optuna tuning config. n_trials is the quickest knob to reduce run time.
# search_space: [min, max] for each hyperparameter.
tuning:
  cnn_mlp:
    n_trials: 30 # 50
    epochs:   [5, 10] # [25, 50, 75]    # Optuna picks among these options
    patience: 10              # EarlyStopping patience
    search_space:
      l2:            [0.0001, 0.0002]
      dropout:       [0.0, 0.4]
      learning_rate: [0.0001, 0.001]
      gamma:         [0.5, 5.0]

  seq2seq:
    n_trials: 50
    search_space:
      units1:        [32, 256]
      units2:        [16, 128]
      dense_units:   [16, 128]
      dropout:       [0.0, 0.5]
      learning_rate: [0.0001, 0.01]
      epochs:        [20, 30, 50]

  transformer:
    n_trials: 50
    search_space:
      d_model:       [32, 64, 128]
      num_heads:     [2, 4]
      ff_dim:        [64, 128, 256]
      num_blocks:    [1, 3]
      dropout:       [0.0, 0.3]
      learning_rate: [0.0001, 0.01]
      epochs:        [20, 30, 50]

  tcn:
    n_trials: 50
    search_space:
      filters:       [32, 64, 128]
      kernel_size:   [3, 5, 7]
      num_blocks:    [3, 6]
      dropout:       [0.0, 0.3]
      learning_rate: [0.0001, 0.01]
      epochs:        [20, 30, 50]

  xgb:
    n_trials: 30
    search_space:
      max_depth:        [3, 10]
      learning_rate:    [0.01, 0.3]
      n_estimators:     [100, 500]
      subsample:        [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_alpha:        [0.0, 1.0]
      reg_lambda:       [0.0, 2.0]
      min_child_weight: [1, 10]
