<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeartWaveML</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: rgb(45, 79, 232);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .header p {
      opacity: 0.9;
      font-size: 1.1em;
    }

    .content {
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .upload-section {
      background: #f8f9ff;
      border-radius: 15px;
      padding: 30px;
      border: 2px dashed #667eea;
      text-align: center;
      transition: all 0.3s ease;
    }

    .upload-section:hover {
      border-color: #764ba2;
      background: #f0f2ff;
    }

    .upload-section.dragover {
      border-color: #4caf50;
      background: #f0fff0;
    }

    .upload-icon {
      font-size: 4em;
      color: #667eea;
      margin-bottom: 20px;
    }

    .file-input {
      display: none;
    }

    .upload-btn {
      background: rgb(45, 79, 232);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .upload-btn:hover {
      transform: translateY(-2px);
    }

    .manual-input {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      border: 1px solid #e0e0e0;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.1);
    }

    .predict-btn {
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.2em;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      margin-top: 20px;
      box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
    }

    .predict-btn:hover {
      transform: translateY(-2px);
    }

    .predict-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .chart-section {
      grid-column: 1 / -1;
      margin-top: 20px;
      background: #f8f9ff;
      border-radius: 15px;
      padding: 30px;
      display: none;
    }

    .chart-section.show {
      display: block;
    }

    .chart-section.show h3 {
      margin-bottom: 16px;
    }

    .results {
      grid-column: 1 / -1;
      margin-top: 20px;
      padding: 30px;
      background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
      border-radius: 15px;
      color: white;
      text-align: center;
      display: none;
    }

    .results.show {
      display: block;
    }

    .result-value {
      font-size: 2em;
      font-weight: bold;
      margin: 20px 0;
      white-space: pre-line;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      grid-column: span 2;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .error {
      background: #ff5722;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      display: none;
      grid-column: span 2;
    }

    .file-info {
      background: #e8f5e8;
      border: 1px solid #4caf50;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      display: none;
    }

    .supported-formats {
      margin-top: 20px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>HeartWaveML</h1>
      <p>Load and Analyze ECG Signals</p>
    </div>

    <div class="content">
      <div class="upload-section" id="uploadSection">
        <div class="upload-icon">📁</div>
        <h3>Load ECG File</h3>
        <p>Drag and drop or select a file to upload</p>
        <input type="file" id="fileInput" class="file-input" accept=".csv,.txt,.json" />
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
          Select File
        </button>
        <div class="supported-formats">
          <strong>Supported Formats:</strong> CSV, TXT
        </div>
        <div class="file-info" id="fileInfo"></div>
      </div>

      <div class="manual-input">
        <h3>Manual Input</h3>
        <form id="ecgForm">
          <div class="form-group">
            <label for="signalData">ECG signal data:</label>
            <textarea id="signalData" rows="8" placeholder="Input exactly 45 consecutive heartbeats, comma-separated (187 samples each), e.g.:
[1.2, 3.4, 2.1, 4.5, 3.2, 1.8, 2.7, ...], [2.1, 3.3, 2.2, 4.1, 3.5, 1.9, 2.8, ...], ... (45 beats total)

The API classifies the center beat (23rd) of the window. Or paste data from a file."></textarea>
          </div>

          <button type="button" class="predict-btn" onclick="predictECG()">
            Classify ECG
          </button>
        </form>
      </div>

      <div class="results" id="results">
        <h3>Prediction:</h3>
        <div class="result-value" id="resultValue">-</div>
        <p id="resultDescription">-</p>
        <p>
          <strong>Average processing time:</strong>
          <span id="processingTime">-</span> ms
        </p>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Processing ECG signal...</p>
      </div>

      <div class="error" id="error"></div>

      <div class="chart-section" id="chartSection">
        <h3>Signal visualization</h3>
        <canvas id="ecgChart1"></canvas>
        <canvas id="ecgChart2"></canvas>
        <canvas id="ecgChart3"></canvas>
        <canvas id="ecgChart4"></canvas>
        <canvas id="ecgChart5"></canvas>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.API_URL || "http://localhost:8000";
    const WINDOW = 45; // must match sequences.window in config.yaml / src/api.py
    const BEAT_LENGTH = 187;

    const CLASSES = {
      0: "Normal beat (N)",
      1: "Supraventricular ectopic beat (S)",
      2: "Ventricular ectopic beat (V)",
    };

    let ecgChart = null;

    const uploadSection = document.getElementById("uploadSection");
    const fileInput = document.getElementById("fileInput");

    uploadSection.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadSection.classList.add("dragover");
    });

    uploadSection.addEventListener("dragleave", () => {
      uploadSection.classList.remove("dragover");
    });

    uploadSection.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadSection.classList.remove("dragover");
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      const fileInfo = document.getElementById("fileInfo");
      fileInfo.innerHTML = `
                      <strong>Loaded file:</strong> ${file.name}<br>
                      <strong>Size:</strong> ${(file.size / 1024).toFixed(
        2
      )} KB<br>
                      <strong>Type:</strong> ${file.type || "text/plain"}
                  `;
      fileInfo.style.display = "block";

      const reader = new FileReader();
      reader.onload = function (e) {
        const content = e.target.result;
        parseFileContent(content, file.name);
      };
      reader.readAsText(file);
    }

    function parseFileContent(content, filename) {
      try {
        let allSignals = [];

        if (filename.endsWith(".csv") || filename.endsWith(".txt")) {
          const lines = content.split("\n");
          for (const line of lines) {
            if (line.trim()) {
              const values = line
                .split(/[,;\t]/)
                .map((v) => parseFloat(v.trim()));
              allSignals.push(...values.filter((v) => !isNaN(v)));
            }
          }
        } else {
          showError(
            "Unsupported file format. Please upload CSV or TXT files."
          );
          return;
        }

        if (allSignals.length > 0) {
          const signalLength = BEAT_LENGTH;
          const separatedSignals = [];

          for (let i = 0; i < allSignals.length; i += signalLength) {
            const signal = allSignals.slice(i, i + signalLength);
            if (signal.length === signalLength) {
              separatedSignals.push(signal);
            }
          }

          if (separatedSignals.length > 0) {
            const formattedText = separatedSignals
              .map((signal) => `[${signal.join(",")}]`)
              .join(", ");

            document.getElementById("signalData").value = formattedText;
            visualizeSignal(separatedSignals);
          } else {
            showError("No complete signals of 187 samples found.");
          }
        } else {
          showError("Valid ECG signal data not found in the file.");
        }
      } catch (error) {
        showError("Error parsing file: " + error.message);
      }
    }

    let ecgCharts = [];

    function visualizeSignal(signals) {
      const contexts = [
        document.getElementById("ecgChart1").getContext("2d"),
        document.getElementById("ecgChart2").getContext("2d"),
        document.getElementById("ecgChart3").getContext("2d"),
        document.getElementById("ecgChart4").getContext("2d"),
        document.getElementById("ecgChart5").getContext("2d"),
      ];

      ecgCharts.forEach((chart) => {
        if (chart) {
          chart.destroy();
        }
      });
      ecgCharts = [];

      let labels = [];

      const segmentSize = 10;
      const segments = [];

      for (let i = 0; i < signals.length; i += segmentSize) {
        segments.push(signals.slice(i, i + segmentSize));
      }

      const maxCharts = Math.min(segments.length, contexts.length);

      segments.slice(0, maxCharts).forEach((segment, index) => {
        if (!contexts[index]) return;

        const startSample = index * segmentSize + 1;
        let segmentLabels = [];
        for (let i = 0; i < segment.length * 187; i++) {
          segmentLabels.push(startSample + i);
        }

        const chart = new Chart(contexts[index], {
          type: "line",
          data: {
            labels: segmentLabels,
            datasets: [
              {
                label: `ECG Segment ${index + 1} (Samples ${startSample}-${startSample + segment.length - 1
                  })`,
                data: segment.flat(),
                borderColor: "#667eea",
                backgroundColor: "rgba(102, 126, 234, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.2,
                pointRadius: 1,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
              title: {
                display: true,
                text: `Segment ${index + 1}`,
              },
            },
            scales: {
              y: {
                beginAtZero: false,
                title: {
                  display: true,
                  text: "Amplitude (mV)",
                },
              },
              x: {
                title: {
                  display: true,
                  text: "Sample Number",
                },
              },
            },
          },
        });

        ecgCharts.push(chart);
      });

      document.getElementById("chartSection").classList.add("show");
    }

    async function predictECG() {
      const signalText = document.getElementById("signalData").value.trim();

      if (!signalText) {
        showError("Please input ECG signal data.");
        return;
      }

      try {
        let signals = [];

        if (signalText.includes("[") && signalText.includes("]")) {
          const listMatches = signalText.match(/\[[^\[\]]*\]/g);
          if (listMatches && listMatches.length > 0) {
            signals = listMatches.map((listStr) => {
              const cleanStr = listStr.replace(/[\[\]]/g, "");
              return cleanStr
                .split(",")
                .map((v) => parseFloat(v.trim()))
                .filter((v) => !isNaN(v));
            });

            for (let i = 0; i < signals.length; i++) {
              if (signals[i].length !== BEAT_LENGTH) {
                showError(
                  `Signal ${i + 1} must have ${BEAT_LENGTH} samples, found ${signals[i].length
                  }`
                );
                return;
              }
            }
          }

          for (let i = 0; i < signals.length; i++) {
            if (signals[i].length !== BEAT_LENGTH) {
              showError(`Signal ${i + 1} must have ${BEAT_LENGTH} samples`);
              return;
            }
          }

          if (signals.length !== WINDOW) {
            showError(
              `Expected exactly ${WINDOW} consecutive beats, got ${signals.length}. ` +
              `The API classifies the center beat of a ${WINDOW}-beat window.`
            );
            return;
          }

          document.getElementById("loading").style.display = "block";
          document.getElementById("results").classList.remove("show");
          document.getElementById("error").style.display = "none";

          let response, data;

          // r_peak_sample: synthetic evenly-spaced positions (real chronological
          // order matters for the RR-interval features, actual timestamps unknown
          // from pasted/manual signal data).
          const beats = signals.map((signal, i) => ({
            signal,
            r_peak_sample: i * 300,
          }));

          response = await fetch(`${API_URL}/predict`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify([{ beats }]),
          });

          data = await response.json();

          if (response.ok) {
            const result = data.results[0];

            if (!result.success) {
              throw new Error(result.error || "Error en la predicción");
            }

            const classId = result.result.prediction;
            const className = CLASSES[classId] || `Unknown class (${classId})`;

            document.getElementById("resultValue").textContent = className;
            document.getElementById("resultDescription").textContent =
              `Center beat (23rd of ${WINDOW}) classification`;
            document.getElementById("processingTime").textContent =
              result.result.processing_time_ms.toFixed(2);

            document.getElementById("results").classList.add("show");

            visualizeSignal(signals);
          } else {
            throw new Error(data.detail || "Error en la predicción");
          }
        } else {
          showError("Please input ECG signal data with the correct format.");
        }
      } catch (error) {
        showError("Error: " + error.message);
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById("error");
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
    }

    // Parametric heartbeat-shaped waveform (baseline + QRS-like bump), just to
    // demo the API contract end-to-end. Not real ECG data: predictions on it
    // are not meaningful, only the request/response wiring is.
    function generateSyntheticBeat(phaseOffset) {
      const beat = new Array(BEAT_LENGTH);
      for (let i = 0; i < BEAT_LENGTH; i++) {
        const t = i / BEAT_LENGTH;
        const qrs = Math.exp(-Math.pow((t - 0.45) * 25, 2));
        beat[i] =
          -0.4 + qrs * 1.3 + 0.02 * Math.sin(2 * Math.PI * 3 * t + phaseOffset);
      }
      return beat;
    }

    function loadExample() {
      const exampleData = [];
      for (let i = 0; i < WINDOW; i++) {
        exampleData.push(generateSyntheticBeat(i * 0.3));
      }
      document.getElementById("signalData").value = exampleData
        .map((signal) => `[${signal.join(",")}]`)
        .join(", ");
      visualizeSignal(exampleData);
    }

    window.addEventListener("load", () => {
      const uploadSection = document.querySelector(".upload-section");
      const exampleBtn = document.createElement("button");
      exampleBtn.className = "upload-btn";
      exampleBtn.textContent = "Load Example Data";
      exampleBtn.onclick = loadExample;
      uploadSection.appendChild(exampleBtn);
    });
  </script>
</body>

</html>
